services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    
    environment:
      POSTGRES_USER: krishna
      POSTGRES_PASSWORD: sonu1234
      POSTGRES_DB: payflow

    ports:
      - 5432:5432
  
  redis:
    image: redis:latest
    container_name: compose-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_store:/data
    restart: always
    command: redis-server --appendonly yes --requirepass "redis1234"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: always

volumes:
  redis_store:

